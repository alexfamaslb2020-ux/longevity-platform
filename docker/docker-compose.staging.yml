version: '3.9'

# =============================================================================
# Longevity Platform — Staging Environment
# =============================================================================
# Prerequisites:
#   1. Create and fill .env.staging (see .env.staging.example)
#   2. Set up DNS A record pointing to the staging host
#   3. Obtain SSL certificates (see docs/staging-deployment.md)
#   4. Ensure docker network is created: docker network create longevity-staging
# =============================================================================

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

networks:
  longevity-staging:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

services:
  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: longevity-staging-db
    restart: unless-stopped
    networks:
      - longevity-staging
    environment:
      POSTGRES_USER: longevity_staging
      POSTGRES_PASSWORD: ${STAGING_DB_PASSWORD:?error}
      POSTGRES_DB: longevity_staging
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U longevity_staging -d longevity_staging"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: longevity-staging-redis
    restart: unless-stopped
    networks:
      - longevity-staging
    command: ["redis-server", "--requirepass", "${STAGING_REDIS_PASSWORD:?error}", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_staging_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${STAGING_REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging

  # ── API ────────────────────────────────────────────────────────────────────
  api:
    image: longevity-api:${COMMIT_SHA:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
      target: production
    container_name: longevity-staging-api
    restart: unless-stopped
    networks:
      - longevity-staging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: staging
      API_PORT: "3001"
      API_PREFIX: /api/v1
      DATABASE_URL: postgresql://longevity_staging:${STAGING_DB_PASSWORD:?error}@postgres:5432/longevity_staging?schema=public
      REDIS_URL: redis://:${STAGING_REDIS_PASSWORD:?error}@redis:6379/1
      JWT_SECRET: ${JWT_SECRET:?error}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-15m}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-7d}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?error}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://staging.longevity.pt}
      WHATSAPP_PROVIDER: mock
      VOICE_PROVIDER: mock
      MESSAGING_PROVIDER: mock
      PAYMENT_PROVIDER: mock
      FEATURE_VOICE_AI: "false"
      FEATURE_CLIENT_PORTAL: "false"
      LOG_LEVEL: info
      LOG_FORMAT: json
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: staging
      METRICS_ENABLED: "true"
      RATE_LIMIT_DISABLED: "false"
      COMMIT_SHA: ${COMMIT_SHA:-unknown}
      APP_VERSION: ${APP_VERSION:-0.1.0}
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/v1/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging: *default-logging

  # ── Frontend ───────────────────────────────────────────────────────────────
  web:
    image: longevity-web:${COMMIT_SHA:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
      target: production
    container_name: longevity-staging-web
    restart: unless-stopped
    networks:
      - longevity-staging
    depends_on:
      - api
    environment:
      NODE_ENV: staging
      NEXT_PUBLIC_API_URL: https://staging.longevity.pt/api/v1
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging: *default-logging

  # ── Reverse Proxy (nginx) ──────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: longevity-staging-nginx
    restart: unless-stopped
    networks:
      - longevity-staging
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.staging.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/includes:/etc/nginx/includes:ro
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 60s
      timeout: 5s
      retries: 3
    logging: *default-logging

volumes:
  postgres_staging_data:
  redis_staging_data:
