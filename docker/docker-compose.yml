version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: longevity-db
    environment:
      POSTGRES_USER: longevity
      POSTGRES_PASSWORD: longevity
      POSTGRES_DB: longevity
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U longevity"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: longevity-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: longevity-api
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://longevity:longevity@postgres:5432/longevity?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-jwt-secret-change-in-production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../apps/api:/app/apps/api
      - /app/apps/api/node_modules
    command: npm run dev

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    container_name: longevity-web
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
    depends_on:
      - api
    volumes:
      - ../apps/web:/app/apps/web
      - /app/apps/web/node_modules
    command: npm run dev

volumes:
  postgres_data:
