# =============================================================================
# Longevity Platform — Demo nginx Configuration
# =============================================================================
# Single entry point on port 8080.
# Frontend at /, API at /api/, health at /api/v1/health/
# Exposed via Cloudflare Tunnel: cloudflared tunnel --url http://localhost:8080
# =============================================================================

upstream api {
    server api:3001;
    keepalive 16;
}

upstream web {
    server web:3000;
    keepalive 16;
}

server {
    listen 8080;
    server_name localhost;

    # ── Request Limits ───────────────────────────────────────────────────────
    client_max_body_size 10M;
    client_body_timeout 30s;
    client_header_timeout 30s;

    # ── Logging ──────────────────────────────────────────────────────────────
    access_log /var/log/nginx/demo-access.log;
    error_log /var/log/nginx/demo-error.log warn;

    # ── Security Headers ─────────────────────────────────────────────────────
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Real IP ──────────────────────────────────────────────────────────────
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    set_real_ip_from 0.0.0.0/0;

    # ── API Proxy ────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 10s;
    }

    # ── Frontend Proxy ───────────────────────────────────────────────────────
    location / {
        proxy_pass http://web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 10s;
    }
}
