name: CI

on:
  push:
    branches: [main, staging, "test/*"]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "22"

jobs:
  validate:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - run: npx prisma generate --schema=apps/api/prisma/schema.prisma
      - run: npm run test

  integration-tests:
    name: Integration & E2E Tests
    runs-on: ubuntu-latest
    needs: validate
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: longevity
          POSTGRES_PASSWORD: longevity
          POSTGRES_DB: longevity_test
        options: >-
          --health-cmd pg_isready -U longevity
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - run: npx prisma generate --schema=apps/api/prisma/schema.prisma
      - run: npx prisma migrate deploy --schema=apps/api/prisma/schema.prisma
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://longevity:longevity@localhost:5432/longevity_test?schema=public
      - run: npm run test:e2e
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://longevity:longevity@localhost:5432/longevity_test?schema=public
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-jwt-secret-at-least-32-chars-long!!
          API_PORT: "3001"
          API_PREFIX: /api/v1
          NODE_ENV: test
      - run: npm run test
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
